plugins { id 'com.android.application' }
android {
 namespace 'ovh.nsip.cytaty'
 buildFeatures { buildConfig true }
 compileSdk 35
 defaultConfig { applicationId 'ovh.nsip.cytaty'; minSdk 26; targetSdk 35; versionCode 6; versionName '1.3.1' }
 signingConfigs {
  release {
   storeType 'PKCS12'
   if (System.getenv('ANDROID_KEYSTORE_PATH')) {
    storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias 'cytaty-ttc'
    keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2'; implementation 'androidx.core:core:1.13.1' }

